name: 每日更新台股儀表板

on:
  schedule:
    - cron: "30 6 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出repo
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行 run_all.py（只更新資料，不發送Telegram）
        run: python run_all.py --stage scan

      - name: 把 dashboard.json 複製進 docs/ 資料夾（GitHub Pages從這裡讀）
        run: cp output/dashboard.json docs/dashboard.json

      - name: 把有更新的資料檔案commit回repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "沒有變動，不用commit" || git commit -m "自動更新：$(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
